<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI활용기초 쪽지시험</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6675;
    --line: #dfe3ea; --accent: #2557d6; --accent-soft: #e8eefc;
    --ok: #1d7a46; --ok-soft: #e4f4ea; --bad: #b42318; --bad-soft: #fdecea;
    --code-bg: #f0f2f5; --warn: #9a5b00; --warn-soft: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --card: #1c2027; --text: #e6e9ef; --muted: #a0a8b6;
      --line: #2e343e; --accent: #7aa2ff; --accent-soft: #23304d;
      --ok: #5fd08f; --ok-soft: #173325; --bad: #ff8a80; --bad-soft: #3a1f1d;
      --code-bg: #12151a; --warn: #ffc56b; --warn-soft: #3a2d14;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .info label { display: block; font-weight: 600; margin-bottom: 6px; }
  .info input {
    width: 100%; max-width: 320px; padding: 9px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .info ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
  h2 { font-size: 1.1rem; margin: 28px 0 10px; color: var(--accent); }
  .q-title { font-weight: 600; margin: 0 0 10px; }
  .q-title b { color: var(--accent); margin-right: 4px; }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; margin: 0 0 12px; overflow-x: auto;
    font-family: Consolas, "D2Coding", "Courier New", monospace; font-size: 0.95rem;
  }
  .opts { display: grid; gap: 8px; }
  @media (min-width: 560px) { .opts.short { grid-template-columns: 1fr 1fr; } }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 5px; accent-color: var(--accent); }
  .opt code { font-family: Consolas, "D2Coding", monospace; }
  .opt.picked { background: var(--accent-soft); border-color: var(--accent); }
  .opt.is-answer { background: var(--ok-soft); border-color: var(--ok); }
  .opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); }
  .card.unanswered { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }
  .feedback span { color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px; }
  button {
    font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); }
  .warn { color: var(--warn); font-weight: 600; }
  #result { display: none; }
  #result.show { display: block; border: 2px solid var(--accent); }
  .score { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
  .score small { font-size: 1rem; color: var(--muted); font-weight: 500; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 0.95rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; white-space: nowrap; }
  .who { color: var(--muted); }
  .hide-correct .card.q.correct { display: none; }
</style>
</head>
<body>
<main>
  <h1>AI활용기초 쪽지시험</h1>
  <p class="sub">20문항 · 4지선다 · 문항당 1점</p>

  <div class="card info">
    <label for="who">학번·이름</label>
    <input id="who" type="text" placeholder="예: 2026001 홍길동" autocomplete="off">
    <ul>
      <li>각 문항에서 정답을 하나 고르세요.</li>
      <li>코드는 직접 실행하지 말고 읽어서 답하세요.</li>
      <li>학번·이름을 꼭 적으세요. 제출은 한 번만 합니다.</li>
      <li>제출하면 답안이 교수님께 전달되고, 이 화면에 채점 결과와 해설이 나옵니다.</li>
    </ul>
  </div>

  <div class="card" id="result" aria-live="polite"></div>

  <div id="quiz"></div>

  <div class="actions">
    <button id="submit">제출하고 채점하기</button>
    <button id="toggle" class="ghost" hidden>틀린 문항만 보기</button>
    <span id="msg" class="warn"></span>
  </div>
</main>

<script>
const CHAPTERS = [
  "1장 프로그래밍 언어와 파이썬",
  "2장 변수와 표준 입출력",
  "3장 자료형과 연산자",
  "4장 리스트·튜플",
  "4장 딕셔너리·집합",
  "5장 조건문"
];

// 구글 스프레드시트 Apps Script 웹 앱 주소 (배포 후 나온 .../exec 주소를 넣으세요)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxztLu2SeQGPSwvOn3hZUEwmJ7IhgZydQRM7qBK488ee-NPKfgEoehSCMGplSLqWJTr/exec";

// ch: 장 번호(CHAPTERS 순서). 정답과 해설은 스프레드시트 스크립트에만 있습니다.
const QUESTIONS = [
  { ch: 0, q: `Google Colab에 대한 설명으로 옳지 않은 것은?`,
    opts: [`웹 브라우저에서 파이썬 코드를 작성하고 실행한다.`, `사용하려면 내 PC에 파이썬을 먼저 설치해야 한다.`, `코드 셀 단위로 실행하고 결과를 셀 아래에서 확인한다.`, `구글 계정으로 로그인해 사용한다.`] },

  { ch: 1, q: `다음 코드의 실행 결과는?`, code: `print("ab" * 2 + "c")`,
    opts: [`ababc`, `ab2c`, `abcabc`, `TypeError`] },
  { ch: 1, q: `다음 코드의 실행 결과는?`, code: `age = 20\nAge = 30\nprint(age)`,
    opts: [`30`, `20`, `50`, `NameError`] },
  { ch: 1, q: `다음 코드의 실행 결과는?`, code: `a = 3\nb = 7\na, b = b, a\nprint(a, b)`,
    opts: [`3 7`, `7 7`, `7 3`, `3 3`] },

  { ch: 2, q: `다음 코드의 실행 결과는?`, code: `print(f'{7 // 2} {7 % 2} {2 ** 3}')`,
    opts: [`3.5 1 6`, `3 1 6`, `3 1 8`, `4 1 8`] },
  { ch: 2, q: `다음 코드의 실행 결과는?`, code: `a = '3'\nb = '4'\nprint(f'{a + b} {int(a) + int(b)}')`,
    opts: [`34 7`, `7 7`, `34 34`, `7 34`] },
  { ch: 2, q: `다음 코드의 실행 결과는?`, code: `print('apple' == 'Apple')`,
    opts: [`True`, `apple`, `오류가 발생한다`, `False`] },
  { ch: 2, q: `1700원을 500원짜리와 100원짜리 동전으로 바꾸려고 한다. 다음 코드의 실행 결과는?`,
    code: `money = 1700\nprint(f'{money // 500} {money % 500 // 100}')`,
    opts: [`3 2`, `3 200`, `3.4 2`, `3 1`] },

  { ch: 3, q: `다음 코드의 실행 결과는?`, code: `a = [10, 20, 30, 40]\nprint(a[1:3])`,
    opts: [`[10, 20]`, `[20, 30, 40]`, `[20, 30]`, `[10, 20, 30]`] },
  { ch: 3, q: `다음 코드의 실행 결과는?`, code: `a = [10, 20, 30, 40]\nprint(a[-1], len(a))`,
    opts: [`40 4`, `40 3`, `30 4`, `IndexError`] },
  { ch: 3, q: `다음 코드의 실행 결과는?`, code: `a = ['a', 'b', 'a', 'c']\nprint(f"{a.count('a')} {a.index('c')}")`,
    opts: [`2 2`, `2 3`, `1 3`, `2 4`] },
  { ch: 3, q: `다음 코드의 실행 결과는?`, code: `a, *b = (1, 2, 3, 4)\nprint(b)`,
    opts: [`(2, 3, 4)`, `[2, 3, 4]`, `2`, `ValueError`] },

  { ch: 4, q: `다음 코드의 실행 결과는?`, code: `d = {'a': 1}\nprint(d['b'])`,
    opts: [`None`, `0`, `KeyError`, `b`] },
  { ch: 4, q: `다음 코드의 실행 결과는?`, code: `d = {'k': 1}\nprint(list(d.items()))`,
    opts: [`['k', 1]`, `{'k': 1}`, `[['k', 1]]`, `[('k', 1)]`] },
  { ch: 4, q: `다음 코드의 실행 결과는?`, code: `s = {1, 2, 2, 3, 3, 3}\nprint(len(s))`,
    opts: [`6`, `1`, `3`, `2`] },
  { ch: 4, q: `s = {1, 2}일 때, 실행하면 오류가 발생하는 것은?`,
    opts: [`s.add(1)`, `s.discard(5)`, `print(5 in s)`, `s.remove(5)`], codeOpts: true },

  { ch: 5, q: `다음 코드의 실행 결과는?`,
    code: `score = 85\nif score >= 60:\n    grade = 'D'\nelif score >= 80:\n    grade = 'B'\nelse:\n    grade = 'F'\nprint(grade)`,
    opts: [`B`, `F`, `D`, `오류가 발생한다`] },
  { ch: 5, q: `다음 코드의 실행 결과는?`, code: `x = 15\nif x > 10:\n    print('X')\nif x > 5:\n    print('Y')`,
    opts: [`X만 출력된다`, `Y만 출력된다`, `아무것도 출력되지 않는다`, `X와 Y가 두 줄로 출력된다`] },
  { ch: 5, q: `문법 오류가 없는 if문의 첫 줄은?`,
    opts: [`if x = 5:`, `if x == 5`, `if x == 5:`, `if (x == 5) then:`], codeOpts: true },
  { ch: 5, q: `다음 코드를 실행하면 발생하는 오류는?`, code: `if True:\nprint('hi')`,
    opts: [`NameError`, `IndentationError`, `TypeError`, `ValueError`] }
];

const MARKS = ["①", "②", "③", "④"];
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");
const msgEl = document.getElementById("msg");
const submitBtn = document.getElementById("submit");
const toggleBtn = document.getElementById("toggle");
let warned = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function build() {
  quizEl.innerHTML = "";
  let lastCh = -1;
  QUESTIONS.forEach((item, i) => {
    if (item.ch !== lastCh) {
      quizEl.appendChild(el("h2", "", CHAPTERS[item.ch]));
      lastCh = item.ch;
    }
    const card = el("div", "card q");
    card.id = "q" + i;
    const title = el("p", "q-title");
    title.appendChild(el("b", "", (i + 1) + "."));
    title.appendChild(document.createTextNode(item.q));
    card.appendChild(title);
    if (item.code) card.appendChild(el("pre", "", item.code));

    const isShort = item.opts.every(o => o.length <= 14);
    const opts = el("div", "opts" + (isShort ? " short" : ""));
    item.opts.forEach((text, j) => {
      const label = el("label", "opt");
      const input = document.createElement("input");
      input.type = "radio"; input.name = "q" + i; input.value = j;
      input.addEventListener("change", () => {
        opts.querySelectorAll(".opt").forEach(o => o.classList.remove("picked"));
        label.classList.add("picked");
        card.classList.remove("unanswered");
      });
      label.appendChild(input);
      const body = el("span");
      body.appendChild(document.createTextNode(MARKS[j] + " "));
      body.appendChild(item.codeOpts ? el("code", "", text) : document.createTextNode(text));
      label.appendChild(body);
      opts.appendChild(label);
    });
    card.appendChild(opts);
    quizEl.appendChild(card);
  });
}

function picked(i) {
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? Number(c.value) : null;
}

async function submitAnswers() {
  const whoEl = document.getElementById("who");
  const who = whoEl.value.trim();
  document.querySelectorAll(".card.q").forEach(c => c.classList.remove("unanswered"));
  if (!who) {
    msgEl.textContent = "학번·이름을 먼저 적어 주세요.";
    whoEl.focus();
    whoEl.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const missing = QUESTIONS.map((_, i) => i).filter(i => picked(i) === null);
  if (missing.length && !warned) {
    missing.forEach(i => document.getElementById("q" + i).classList.add("unanswered"));
    msgEl.textContent = "풀지 않은 문항이 " + missing.length + "개 있습니다. 그대로 제출하려면 한 번 더 누르세요.";
    submitBtn.textContent = "그대로 제출하기";
    warned = true;
    document.getElementById("q" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const answers = QUESTIONS.map((_, i) => picked(i));
  setLocked(true);
  submitBtn.disabled = true;
  submitBtn.textContent = "채점 중…";
  msgEl.textContent = "";

  let data;
  try {
    if (!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)) throw new Error("채점 주소가 설정되지 않았습니다.");
    // text/plain으로 보내야 브라우저가 사전 확인 요청 없이 바로 보냅니다.
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ who, answers }) });
    data = await res.json();
    if (!data.ok) throw new Error(data.error || "채점하지 못했습니다.");
  } catch (err) {
    setLocked(false);
    submitBtn.disabled = false;
    submitBtn.textContent = "다시 제출하기";
    msgEl.textContent = "제출하지 못했습니다. 인터넷 연결을 확인하고 다시 제출해 주세요. (" + err.message + ")";
    return;
  }

  QUESTIONS.forEach((item, i) => {
    const card = document.getElementById("q" + i);
    const r = data.results[i];
    const choice = answers[i];
    card.classList.add(r.right ? "correct" : "wrong");
    const labels = card.querySelectorAll(".opt");
    labels[r.ans].classList.add("is-answer");
    if (choice !== null && !r.right) labels[choice].classList.add("is-wrong");
    const fb = el("div", "feedback " + (r.right ? "ok" : "bad"));
    const head = r.right ? "정답" : (choice === null ? "풀지 않음 · 정답 " + MARKS[r.ans] : "오답 · 정답 " + MARKS[r.ans]);
    fb.appendChild(el("strong", "", head + "  "));
    fb.appendChild(el("span", "", r.why));
    card.appendChild(fb);
  });

  showResult(who, data.score, data.total, data.perCh);
  submitBtn.hidden = true;
  toggleBtn.hidden = data.score === data.total;
}

function setLocked(on) {
  document.getElementById("who").disabled = on;
  document.querySelectorAll("#quiz input").forEach(inp => inp.disabled = on);
}

function showResult(who, score, total, perCh) {
  resultEl.innerHTML = "";
  const stamp = new Date().toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
  resultEl.appendChild(el("p", "who", who + " · 제출 시각 " + stamp + " · 제출 완료"));
  const s = el("p", "score", score + " ");
  s.appendChild(el("small", "", "/ " + total + "점 (" + Math.round(score / total * 100) + "%)"));
  resultEl.appendChild(s);

  const table = el("table");
  const thead = el("tr");
  ["장", "맞힌 문항"].forEach(h => thead.appendChild(el("th", "", h)));
  table.appendChild(thead);
  perCh.forEach((p, k) => {
    const tr = el("tr");
    tr.appendChild(el("td", "", CHAPTERS[k]));
    tr.appendChild(el("td", "num", p.ok + " / " + p.total));
    table.appendChild(tr);
  });
  resultEl.appendChild(table);
  resultEl.classList.add("show");
  resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
}

submitBtn.addEventListener("click", submitAnswers);
toggleBtn.addEventListener("click", () => {
  const on = document.body.classList.toggle("hide-correct");
  toggleBtn.textContent = on ? "모든 문항 보기" : "틀린 문항만 보기";
});

build();
</script>
</body>
</html>
